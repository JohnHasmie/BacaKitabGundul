<div style="width: 390px; height: 844px; background: #F1EFE9; display: flex; flex-direction: column; overflow: hidden;">

      </div>
      <div style="display: flex; justify-content: space-between;">

        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><div style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; border: 2.5px dashed #B5B0A0;"></div><div style="font-size: 10px; font-weight: 700; color: #8A8574;">K</div></div>

      </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">

        <div dir="rtl" style="font-family: 'Amiri', serif; font-size: 20px; color: #F0A63A;">&#1575;&#1604;&#1570;&#1580;&#1585;&#1608;&#1605;&#1610;&#1577;</div>

      <div style="background: #191813; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 118px;">
        <div style="font-size: 13px; font-weight: 800; color: #F1EFE9;">Kata Tersimpan</div>
        <div style="font-size: 34px; font-weight: 800; color: #F0A63A; line-height: 1;">24</div>
        <div style="margin-top: auto; font-size: 10.5px; font-weight: 700; color: #B5B0A0;">+3 minggu ini</div>
      </div>
      <div style="background: #174D38; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 118px;">

          <div style="font-size: 11px; font-weight: 800; color: #191813;">MULAI</div>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#191813" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>

      </div>
      <div style="background: #FFFFFF; border: 3px dashed #B5B0A0; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 118px;">
        <div style="width: 38px; height: 38px; border-radius: 14px; background: #F1EFE9; border: 2.5px solid #191813; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800;">+</div>
        <div style="font-size: 12px; font-weight: 800; color: #6E6A5B;">Tambah Kitab</div>

      <div style="background: #FFFFFF; border: 2.5px solid #191813; border-radius: 16px 16px 16px 4px; padding: 9px 14px; font-size: 12px; font-weight: 700;">Sudah muroja'ah hari ini? 5 kata menunggumu!</div>

  <div style="display: flex; align-items: center; background: #191813; padding: 12px 14px 24px 14px; gap: 6px;">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 7px; background: #F0A63A; border-radius: 999px; padding: 10px 0; min-height: 44px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#191813" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4.5l8 7V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z"></path></svg>

    <div style="flex-grow: 1; display: flex; justify-content: center; padding: 10px 0; min-height: 44px; align-items: center;">
